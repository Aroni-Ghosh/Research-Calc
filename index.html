<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photon Energy Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .calculator {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h2>Photon Energy Calculator</h2>

    <label for="wavelength">
        Wavelength (nm)
    </label>

    <input
        type="number"
        id="wavelength"
        value="470"
        step="any"
        min="0"
    >

    <button onclick="calculateEnergy()">
        Calculate
    </button>

    <div class="result" id="result">
        Enter a wavelength and click Calculate.
    </div>

</div>


<script>

function calculateEnergy() {

    const wavelength = parseFloat(
        document.getElementById("wavelength").value
    );

    if (wavelength <= 0 || isNaN(wavelength)) {
        document.getElementById("result").innerHTML =
            "Please enter a valid wavelength.";
        return;
    }

    // Physical constants
    const h = 6.62607015e-34;       // J·s
    const c = 299792458;            // m/s
    const q = 1.602176634e-19;      // J/eV

    // Convert nm to m
    const wavelength_m = wavelength * 1e-9;

    // Photon energy
    const energy_J = h * c / wavelength_m;

    // Convert joules to electron-volts
    const energy_eV = energy_J / q;

    document.getElementById("result").innerHTML =

        "<strong>Photon Energy</strong><br><br>" +

        energy_eV.toFixed(4) + " eV<br>" +

        energy_J.toExponential(4) + " J";

}

</script>

</body>

</html>
