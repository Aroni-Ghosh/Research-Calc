<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Research Calculators</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .calculator {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }

        .divider {
            margin: 25px 0;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Research Calculators</h1>


    <!-- ====================================== -->
    <!-- Photon Energy Calculator -->
    <!-- ====================================== -->

    <div class="calculator">

        <h2>Photon EEnergy Calculator</h2>

        <label for="wavelength">
            Wavelength (nm)
        </label>

        <input
            type="number"
            id="wavelength"
            value="470"
            step="any"
            min="0"
        >

        <button onclick="calculateEnergy()">
            Calculate Photon Energy
        </button>

        <div class="result" id="energyResult">
            Enter a wavelength and click Calculate.
        </div>

    </div>


    <!-- ====================================== -->
    <!-- dBm Calculator -->
    <!-- ====================================== -->

    <div class="calculator">

        <h2>dBm / Power Calculator</h2>


        <!-- dBm to Power -->

        <label for="dbmInput">
            Power (dBm)
        </label>

        <input
            type="number"
            id="dbmInput"
            value="0"
            step="any"
        >

        <button onclick="dbmToPower()">
            Convert dBm → Power
        </button>

        <div class="result" id="dbmResult">
            Enter power in dBm.
        </div>


        <div class="divider"></div>


        <!-- Power to dBm -->

        <label for="mwInput">
            Power (mW)
        </label>

        <input
            type="number"
            id="mwInput"
            value="1"
            step="any"
            min="0"
        >

        <button onclick="powerToDbm()">
            Convert Power → dBm
        </button>

        <div class="result" id="powerResult">
            Enter power in mW.
        </div>

    </div>

</div>


<script>

/* =========================================
   Photon Energy Calculator
========================================= */

function calculateEnergy() {

    const wavelength =
        parseFloat(document.getElementById("wavelength").value);

    if (wavelength <= 0 || isNaN(wavelength)) {

        document.getElementById("energyResult").innerHTML =
            "Please enter a valid wavelength.";

        return;
    }

    const h = 6.62607015e-34;       // J·s
    const c = 299792458;            // m/s
    const q = 1.602176634e-19;      // J/eV

    const wavelength_m =
        wavelength * 1e-9;

    const energy_J =
        h * c / wavelength_m;

    const energy_eV =
        energy_J / q;

    const frequency =
        c / wavelength_m;

    document.getElementById("energyResult").innerHTML =

        "<strong>Photon Energy</strong><br><br>" +

        energy_eV.toFixed(4) + " eV<br>" +

        energy_J.toExponential(4) + " J<br><br>" +

        "<strong>Frequency</strong><br>" +

        (frequency / 1e12).toFixed(3) + " THz";
}


/* =========================================
   dBm → Power
========================================= */

function dbmToPower() {

    const dbm =
        parseFloat(document.getElementById("dbmInput").value);

    if (isNaN(dbm)) {

        document.getElementById("dbmResult").innerHTML =
            "Please enter a valid dBm value.";

        return;
    }

    const power_mW =
        Math.pow(10, dbm / 10);

    const power_W =
        power_mW / 1000;

    const power_uW =
        power_mW * 1000;

    document.getElementById("dbmResult").innerHTML =

        "<strong>Power</strong><br><br>" +

        power_W.toExponential(4) + " W<br>" +

        power_mW.toExponential(4) + " mW<br>" +

        power_uW.toExponential(4) + " µW";
}


/* =========================================
   Power → dBm
========================================= */

function powerToDbm() {

    const power_mW =
        parseFloat(document.getElementById("mwInput").value);

    if (power_mW <= 0 || isNaN(power_mW)) {

        document.getElementById("powerResult").innerHTML =
            "Power must be greater than zero.";

        return;
    }

    const dbm =
        10 * Math.log10(power_mW);

    document.getElementById("powerResult").innerHTML =

        "<strong>Power</strong><br><br>" +

        dbm.toFixed(4) + " dBm";
}

</script>

</body>

</html>
